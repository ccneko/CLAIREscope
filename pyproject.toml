[project]
name = "CLAIREscope"
version = "1.0.0"
description = "Interactive Streamlit Single-Cell RNA-seq Multi-Dataset Expression, Composition, Scoring & Correlation Viewer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.35.0",
    "scanpy>=1.10.0",
    "pandas>=2.0.0",
    "numpy>=2.5.0",
    "numba>=0.67.0",
    "scipy>=1.18.1",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.20.0",
    "pyyaml>=6.0.1",
    "h5py>=3.10.0",
    "openpyxl>=3.1.5"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
