[project]
name = "sc-expression-viewer"
version = "0.1.0"
description = "Interactive Streamlit Single-Cell RNA-seq Multi-Dataset Expression, Composition, Scoring & Correlation Viewer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "scanpy>=1.10.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.20.0",
    "pyyaml>=6.0.1",
    "h5py>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
