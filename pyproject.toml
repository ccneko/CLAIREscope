[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clairescope"
version = "1.0.0"
description = "Cellular Landscape Analysis, Interpretation & Results Explorer for Single-Cell & Spatial Transcriptomics"
readme = "README.md"
authors = [
    { name = "Claire Chung", email = "claire@hokudai.ac.jp" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "scanpy>=1.9.0",
    "anndata>=0.9.0",
    "pandas>=2.0.0",
    "numpy>=1.23.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "pyyaml>=6.0",
    "streamlit-sortables>=0.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0"
]

[project.scripts]
clairescope = "clairescope.cli:main"
clairescope-gui = "clairescope.gui:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["clairescope*"]
