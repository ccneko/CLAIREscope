<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Draggable Multiselect</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #1e293b;
      background: transparent;
      padding: 2px 2px 8px 2px;
      overflow: visible;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .label {
      font-size: 13.5px;
      font-weight: 600;
      color: #334155;
      display: block;
    }
    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .action-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11.5px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      transition: all 0.15s ease;
      line-height: 1.3;
    }
    .action-btn:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
      color: #0f172a;
    }
    .action-btn.primary {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #991b1b;
    }
    .action-btn.primary:hover {
      background: #fecaca;
      border-color: #f87171;
      color: #7f1d1d;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background-color: #ffffff;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      min-height: 42px;
      position: relative;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      cursor: text;
      box-shadow: 0 1px 2px rgba(239, 68, 68, 0.04);
    }
    .container:hover {
      border-color: #f87171;
    }
    .container:focus-within {
      border-color: #ef4444;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
    }
    .chip-list {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      border-radius: 6px;
      padding: 3px 8px 3px 6px;
      font-size: 13px;
      font-weight: 600;
      user-select: none;
      cursor: grab;
      transition: all 0.15s ease;
      box-shadow: 0 1px 2px rgba(239, 68, 68, 0.05);
    }
    .chip:hover {
      background-color: #fee2e2;
      border-color: #fca5a5;
      color: #7f1d1d;
    }
    .chip:active {
      cursor: grabbing;
      background-color: #fecaca;
    }
    .chip.dragging {
      opacity: 0.4;
      border: 1px dashed #ef4444;
      background-color: #fee2e2;
    }
    .chip.drag-over {
      border-left: 3px solid #dc2626;
      padding-left: 4px;
    }
    .drag-handle {
      margin-right: 5px;
      color: #ef4444;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      opacity: 0.85;
    }
    .chip-text {
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .remove-btn {
      margin-left: 6px;
      color: #ef4444;
      font-size: 15px;
      line-height: 1;
      border: none;
      background: transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      transition: background-color 0.15s, color 0.15s;
    }
    .remove-btn:hover {
      background-color: #fecaca;
      color: #7f1d1d;
    }
    .input-wrapper {
      flex: 1;
      min-width: 130px;
      position: relative;
    }
    .search-input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 13.5px;
      color: #0f172a;
      padding: 4px 0;
    }
    .search-input::placeholder {
      color: #94a3b8;
    }
    .dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1px solid #fca5a5;
      border-radius: 6px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.15);
      display: none;
    }
    .dropdown.show {
      display: block;
    }
    .dropdown-item {
      padding: 7px 12px;
      font-size: 13px;
      color: #1e293b;
      cursor: pointer;
      transition: background-color 0.1s;
    }
    .dropdown-item:hover, .dropdown-item.active {
      background-color: #fef2f2;
      color: #dc2626;
      font-weight: 600;
    }
    .dropdown-empty {
      padding: 8px 12px;
      color: #94a3b8;
      font-size: 12.5px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="header-row">
      <label class="label" id="label-text"></label>
      <div class="header-actions">
        <button type="button" class="action-btn primary" id="btn-select-all" title="Select all available options">⚡ Select all</button>
        <button type="button" class="action-btn" id="btn-clear-all" title="Clear all selected options">✕ Clear</button>
      </div>
    </div>
    <div class="container" id="container" onclick="focusInput()">
      <ul class="chip-list" id="chip-list"></ul>
      <div class="input-wrapper">
        <input 
          type="text" 
          class="search-input" 
          id="search-input" 
          placeholder="Type to search & add..."
          autocomplete="off"
        />
        <div class="dropdown" id="dropdown"></div>
      </div>
    </div>
  </div>

  <script>
    function sendMessageToStreamlit(type, data) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: type,
        ...data
      }, "*");
    }

    const Streamlit = {
      setComponentReady: () => sendMessageToStreamlit("streamlit:componentReady", { apiVersion: 1 }),
      setFrameHeight: (height) => sendMessageToStreamlit("streamlit:setFrameHeight", { height: height || document.body.offsetHeight + 10 }),
      setComponentValue: (value) => sendMessageToStreamlit("streamlit:setComponentValue", { value: value })
    };

    let allOptions = [];
    let selectedItems = [];
    let activeDropdownIndex = -1;
    let isInitialized = false;
    let userHasInteracted = false;

    const labelText = document.getElementById("label-text");
    const chipList = document.getElementById("chip-list");
    const searchInput = document.getElementById("search-input");
    const dropdown = document.getElementById("dropdown");
    const container = document.getElementById("container");
    const btnSelectAll = document.getElementById("btn-select-all");
    const btnClearAll = document.getElementById("btn-clear-all");

    btnSelectAll.addEventListener("click", (e) => {
      e.stopPropagation();
      userHasInteracted = true;
      selectedItems = [...allOptions];
      renderChips();
      notifyStreamlit();
      hideDropdown();
    });

    btnClearAll.addEventListener("click", (e) => {
      e.stopPropagation();
      userHasInteracted = true;
      selectedItems = [];
      renderChips();
      notifyStreamlit();
      hideDropdown();
    });

    function focusInput() {
      searchInput.focus();
    }

    function renderChips() {
      chipList.innerHTML = "";
      selectedItems.forEach((item, index) => {
        const li = document.createElement("li");
        li.className = "chip";
        li.draggable = true;
        li.dataset.index = index;

        li.innerHTML = `
          <span class="drag-handle">⠿</span>
          <span class="chip-text" title="${item}">${item}</span>
          <button type="button" class="remove-btn" onclick="removeItem(event, ${index})">&times;</button>
        `;

        li.addEventListener("dragstart", handleDragStart);
        li.addEventListener("dragover", handleDragOver);
        li.addEventListener("dragleave", handleDragLeave);
        li.addEventListener("drop", handleDrop);
        li.addEventListener("dragend", handleDragEnd);

        chipList.appendChild(li);
      });

      updateHeight();
    }

    let draggedItemIndex = null;

    function handleDragStart(e) {
      draggedItemIndex = parseInt(this.dataset.index);
      this.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", draggedItemIndex);
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const targetIndex = parseInt(this.dataset.index);
      if (targetIndex !== draggedItemIndex) {
        this.classList.add("drag-over");
      }
    }

    function handleDragLeave() {
      this.classList.remove("drag-over");
    }

    function handleDrop(e) {
      e.preventDefault();
      this.classList.remove("drag-over");
      const targetIndex = parseInt(this.dataset.index);

      if (draggedItemIndex !== null && draggedItemIndex !== targetIndex) {
        userHasInteracted = true;
        const movedItem = selectedItems.splice(draggedItemIndex, 1)[0];
        selectedItems.splice(targetIndex, 0, movedItem);
        renderChips();
        notifyStreamlit();
      }
    }

    function handleDragEnd() {
      this.classList.remove("dragging");
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("drag-over"));
    }

    function removeItem(e, index) {
      e.stopPropagation();
      userHasInteracted = true;
      selectedItems.splice(index, 1);
      renderChips();
      notifyStreamlit();
      renderDropdown();
    }

    function addItem(item) {
      if (!selectedItems.includes(item)) {
        userHasInteracted = true;
        selectedItems.push(item);
        searchInput.value = "";
        renderChips();
        notifyStreamlit();
        hideDropdown();
      }
    }

    function notifyStreamlit() {
      Streamlit.setComponentValue([...selectedItems]);
    }

    function getFilteredOptions(query) {
      const q = query.toLowerCase().trim();
      return allOptions.filter(opt => !selectedItems.includes(opt) && (q === "" || opt.toLowerCase().includes(q)));
    }

    function renderDropdown() {
      const query = searchInput.value;
      const filtered = getFilteredOptions(query);

      dropdown.innerHTML = "";
      activeDropdownIndex = -1;

      if (filtered.length === 0) {
        if (query.trim() !== "") {
          dropdown.innerHTML = '<div class="dropdown-empty">No matching options</div>';
          dropdown.classList.add("show");
        } else {
          hideDropdown();
        }
      } else {
        filtered.slice(0, 100).forEach((opt, idx) => {
          const item = document.createElement("div");
          item.className = "dropdown-item";
          item.textContent = opt;
          item.dataset.index = idx;
          item.onmousedown = (e) => {
            e.preventDefault();
            addItem(opt);
          };
          dropdown.appendChild(item);
        });
        dropdown.classList.add("show");
      }
      updateHeight();
    }

    function hideDropdown() {
      dropdown.classList.remove("show");
      updateHeight();
    }

    function updateHeight() {
      setTimeout(() => {
        let h = document.getElementById("root").offsetHeight + 16;
        if (dropdown.classList.contains("show")) {
          h += dropdown.offsetHeight + 10;
        }
        Streamlit.setFrameHeight(Math.max(h, 55));
      }, 30);
    }

    searchInput.addEventListener("input", () => {
      renderDropdown();
    });

    searchInput.addEventListener("focus", () => {
      renderDropdown();
    });

    searchInput.addEventListener("blur", () => {
      setTimeout(hideDropdown, 200);
    });

    searchInput.addEventListener("keydown", (e) => {
      const items = dropdown.querySelectorAll(".dropdown-item");
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (items.length > 0) {
          activeDropdownIndex = (activeDropdownIndex + 1) % items.length;
          updateActiveDropdownItem(items);
        }
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (items.length > 0) {
          activeDropdownIndex = (activeDropdownIndex - 1 + items.length) % items.length;
          updateActiveDropdownItem(items);
        }
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (activeDropdownIndex >= 0 && items[activeDropdownIndex]) {
          items[activeDropdownIndex].onmousedown(e);
        } else if (items.length > 0) {
          items[0].onmousedown(e);
        }
      } else if (e.key === "Backspace" && searchInput.value === "" && selectedItems.length > 0) {
        userHasInteracted = true;
        selectedItems.pop();
        renderChips();
        notifyStreamlit();
        renderDropdown();
      }
    });

    function updateActiveDropdownItem(items) {
      items.forEach((item, idx) => {
        if (idx === activeDropdownIndex) {
          item.classList.add("active");
          item.scrollIntoView({ block: "nearest" });
        } else {
          item.classList.remove("active");
        }
      });
    }

    function onRender(event) {
      const { args } = event.detail;
      
      if (args.label) {
        labelText.textContent = args.label;
        labelText.style.display = "block";
      } else {
        labelText.style.display = "none";
      }

      allOptions = args.options || [];

      if (!isInitialized) {
        selectedItems = args.default ? [...args.default] : [];
        isInitialized = true;
        renderChips();
      } else if (!userHasInteracted && args.default) {
        if (JSON.stringify(args.default) !== JSON.stringify(selectedItems)) {
          selectedItems = [...args.default];
          renderChips();
        }
      }
      
      updateHeight();
    }

    window.addEventListener("DOMContentLoaded", () => {
      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "streamlit:render") {
          onRender({ detail: event.data });
        }
      });
      Streamlit.setComponentReady();
      updateHeight();
    });
  </script>
</body>
</html>
