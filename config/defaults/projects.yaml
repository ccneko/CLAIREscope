DEMO_SKIN_ATLAS:
  id: DEMO
  name: Human Epidermal Single-Cell Demo Atlas (Wang 2020)
  species: Human
  description: Public demonstration human epidermal single-cell reference across basal
    stem cells, cell cycle phases, and differentiation (Wang et al., 2020 Nat Commun,
    GSE147482, CC BY 4.0).
  paths:
    windows: data\demo_skin_atlas
    wsl: data/demo_skin_atlas
    linux: data/demo_skin_atlas
  scan_subdirs:
  - ''
  - data
  - demo
  default_preload: demo_wang2020_epidermis.h5ad
  default_dataset: demo_wang2020_epidermis.h5ad
  canonical_samples:
  - Donor_1
  - Donor_2
  - Donor_3
  - Donor_4
  - Donor_5
  sample_colors:
    Donor_1: '#3B82F6'
    Donor_2: '#10B981'
    Donor_3: '#F59E0B'
    Donor_4: '#8B5CF6'
    Donor_5: '#EC4899'
  default_pairs:
  - - Donor_1
    - Donor_2
  - - Donor_3
    - Donor_4
  default_signatures:
    Basal Anchoring & Adhesion:
    - COL17A1
    - ITGA6
    - ITGB4
    - DST
    - LAMA3
    - LAMB3
    - LAMC2
    - BCAM
    Suprabasal Differentiation:
    - KRT1
    - KRT10
    - DSG1
    - DSC1
    - DMKN
    - SBSN
    Terminal Cornification:
    - FLG
    - FLG2
    - LOR
    - IVL
    - TGM1
    Cell Cycle & Proliferation:
    - MKI67
    - TOP2A
    - PCNA
    - CDK1
    - CCNB1
    - AURKA
    Stress & Wound Activation:
    - KRT6A
    - KRT16
    - KRT17
    - ITGB6
    - S100A8
    - S100A9
