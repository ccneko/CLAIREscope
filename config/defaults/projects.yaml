DEMO_SKIN_ATLAS:
  id: DEMO
  name: Human Epidermal Single-Cell Demo Atlas
  species: Human
  description: Public demonstration single-cell RNA-seq reference of human epidermal
    differentiation and homeostasis.
  paths:
    windows: data\demo_skin_atlas
    wsl: /home/claire/dev/CLAIREscope/data/demo_skin_atlas
    linux: data/demo_skin_atlas
  scan_subdirs:
  - data
  - demo
  default_dataset: demo_epidermis_h5ad
  canonical_samples:
  - Control_1
  - Control_2
  - Treated_1
  - Treated_2
  sample_colors:
    Control_1: '#2563EB'
    Control_2: '#38BDF8'
    Treated_1: '#DC2626'
    Treated_2: '#F97316'
  default_pairs:
  - - Treated_1
    - Control_1
  - - Treated_2
    - Control_2
  default_signatures:
    Basal Anchoring & Adhesion:
    - COL17A1
    - ITGA6
    - ITGB4
    - DST
    - LAMA3
    - LAMB3
    - LAMC2
    - BCAM
    Suprabasal Differentiation:
    - KRT1
    - KRT10
    - DSG1
    - DSC1
    - DMKN
    - SBSN
    Terminal Cornification:
    - FLG
    - FLG2
    - LOR
    - IVL
    - TGM1
    Stress & Wound Activation:
    - KRT6A
    - KRT16
    - KRT17
    - ITGB6
    - S100A8
    - S100A9
CHENG_2018_HUMAN_SKIN:
  id: Cheng2018
  name: Human Epidermis Single-Cell Atlas (Cheng et al., Cell Reports 2018)
  species: Human
  description: Landmark single-cell RNA-seq reference of healthy human skin defining
    basal stem (Basal 1), secretory (Basal 2), spinous, and granular differentiation
    states.
  paths:
    windows: data/Data\Project_A
    wsl: data/Data/Project_A
    linux: data/Data/Project_A
  scan_subdirs:
  - out/2026-09-05_cheng2018
  - data/2025-11-26_EGA_Cheng2018
  default_dataset: cheng2018_trunk_processed (2026-09-05_cheng2018)
  canonical_samples:
  - Trunk
  - Foreskin
  - Donor_1
  - Donor_2
  - Donor_3
  sample_colors:
    Trunk: '#2563EB'
    Foreskin: '#F59E0B'
    Donor_1: '#3B82F6'
    Donor_2: '#10B981'
    Donor_3: '#8B5CF6'
  default_pairs:
  - - Foreskin
    - Trunk
  - - Donor_2
    - Donor_1
  default_signatures:
    Basal 1 (Quiescent / Anchored):
    - COL17A1
    - DST
    - ITGB4
    - ITGA6
    - BCAM
    - POSTN
    - COL4A1
    - COL4A2
    - LAMA3
    Basal 2 (Secretory / Activated):
    - MIF
    - AREG
    - EREG
    - VEGFA
    - IL1B
    - CXCL8
    - PTGES
    - CCL2
    - HBEGF
    - TNFAIP3
    Suprabasal / Spinous Differentiation:
    - KRT1
    - KRT10
    - DSG1
    - DSC1
    - DMKN
    - SBSN
    - KRTDAP
    - CALML5
    - SPINK5
    Granular / Cornified Layer:
    - FLG
    - FLG2
    - LOR
    - IVL
    - TGM1
    - TGM3
    - LCE1A
    - LCE2A
    - LCE3D
    - SPRR1A
    - SPRR1B
    - SPRR2A
    Adherens Junction Complex:
    - CDH1
    - CTNNB1
    - CTNNA1
    - CTNND1
    - JUP
    - CDH2
    - CTNNA2
    - PLEKHA7
    - PNN
    Desmosome Architecture:
    - DSP
    - PKP1
    - PKP3
    - DSG1
    - DSG3
    - DSC1
    - DSC3
    - PPL
    - EVPL
    - PKP2
    - JUP
    Cycling Keratinocytes:
    - MKI67
    - TOP2A
    - CCNB1
    - CCNB2
    - CDK1
    - PCNA
    - AURKA
    - PLK1
  default_preload: cheng2018_trunk_processed.h5ad
  win_base: data/Data\Project_A
  wsl_base: data/Data/Project_A
